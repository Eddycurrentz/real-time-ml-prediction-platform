[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rtml"
version = "0.1.0"
description = "Real-time transaction anomaly detection platform"
requires-python = ">=3.11"
# Runtime dependencies of the serving API. Offline pipeline and Kafka/Postgres
# dependencies live in the optional extras below, so deployments that only run
# the API (for example a serverless FastAPI bundle) install just what the API
# imports at runtime.
dependencies = [
    "fastapi>=0.110,<1",
    "pydantic>=2.6,<3",
    "prometheus-client>=0.20,<1",
    "structlog>=24.1,<26",
    "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
pipeline = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "pyarrow>=23.0.1,<26",
    "scikit-learn>=1.4,<2",
]
streaming = [
    "confluent-kafka>=2.5,<3",
    "psycopg[binary]>=3.1,<4",
]
dev = [
    "build>=1.2,<2",
    "pre-commit>=3.6,<5",
    "pytest>=9.0.3,<10",
    "pytest-cov>=4.1,<7",
    "ruff>=0.4,<1",
    "httpx2>=2,<3",
    "pip-audit>=2.7,<3",
    "PyYAML>=6,<7",
    "setuptools>=83,<100",
]

[project.scripts]
rtml-generate = "rtml.data.generator:main"
rtml-produce = "rtml.streaming.producer:main"
rtml-consume = "rtml.streaming.consumer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rtml.api" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.vercel]
# Vercel's FastAPI builder cannot guess the src/ layout of this project and
# looks for an `app` instance in the module path below.
entrypoint = "src.rtml.api:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
