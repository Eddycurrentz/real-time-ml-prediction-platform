name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,pipeline,streaming]'

      - name: Lint
        run: ruff check .

      - name: Audit dependencies
        run: pip-audit --progress-spinner off

      - name: Unit tests
        run: pytest tests/unit -q --cov=rtml --cov-report=term-missing

      - name: Build package
        run: python -m build
